          <h1>自行车气嘴是美嘴还是法嘴</h1>
          <p class="lede">自行车气嘴是美嘴还是法嘴？两种气嘴都能打，先看气嘴根部再选转接头。</p>
          <section>
            <p>美嘴较粗，法嘴较细，还常带一颗小锁母。打气前把锁母拧松，打完再拧回，否则气筒夹不紧。</p><p>不确定时把气嘴带到店里比一下。转接头选错会把气嘴芯带出来。</p>
