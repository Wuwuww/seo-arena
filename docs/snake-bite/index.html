      <h1>自行车蛇咬是什么</h1>
      <p class="lede">自行车蛇咬是什么？内胎上并排两个小孔，多半是胎压过低后轮圈夹到内胎。</p>
      <figure>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="内胎上并排的两个小孔"><rect width="640" height="280" fill="#f3efe6"/><rect x="24" y="24" width="592" height="232" fill="#fffdf8" stroke="#e4ddd2"/><circle cx="180" cy="140" r="16" fill="#1c1917"/><circle cx="230" cy="140" r="16" fill="#1c1917"/><text x="300" y="130" fill="#1c1917" font-size="28">并排两孔</text><text x="300" y="174" fill="#57534e" font-size="20">轮圈夹到内胎</text></svg>
        <figcaption>内胎上并排的两个小孔。内胎上并排两个小孔，多半是胎压过低后轮圈夹到内胎。</figcaption>
      </figure>
      <section>
        <p>只补其中一个孔还会漏。先确认轮圈胶带没有移位，再换内胎或把两个孔都补上，并把胎压打回侧壁区间。</p><p>两个孔都处理好之后再充气。只补一个，骑出去还会瘪。</p>
