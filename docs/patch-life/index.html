      <h1>自行车内胎补好能骑多久</h1>
      <p>自行车内胎补好能骑多久？冷补丁压实后可以继续骑，鼓包或第二次漏气就换内胎。</p><p>补丁边缘如果翘起，充气后会在几公里内再次漏完。蛇咬造成的双孔不适合只补一个眼，内胎该换。</p><p>补完把车轮泡进水盆看还有没有气泡。还有气泡就换内胎，不要反复补同一处。</p>
